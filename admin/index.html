<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Growth Studio · Athem Ventures</title><link rel="stylesheet" href="/admin/growth.css?v=short-video-3"></head>
<body>
<div id="login" class="login"><p class="wordmark">Athem Ventures</p><h1>Growth Studio</h1><p>One system. A separate workspace for every product.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit" class="primary">Sign in</button><p id="loginError" role="alert"></p></form></div>
<div id="app" hidden>
<aside class="sidebar"><a class="wordmark" href="/admin/">Athem Ventures</a><label class="product-label" for="product">PRODUCT WORKSPACE</label><select id="product" aria-label="Product workspace"></select><button id="addProduct" class="subtle">+ Add a product</button><nav aria-label="Studio"><button data-view="overview">Overview</button><button data-view="agents">Agent map</button><button data-view="accounts">Account setup</button><button data-view="content">Content studio</button><button data-view="campaigns">Campaign desk</button><button data-view="trends">Trend desk</button><button data-view="meta">Meta ads</button><button data-view="runs">Runs and outputs</button><button data-view="learning">Results and memory</button><button data-view="settings">Brand and sources</button></nav><div class="sidebar-bottom"><a href="/admin/registry.html">Installed tools and hooks ↗</a><a href="/architecture/">Agency architecture ↗</a><p id="worker">Checking worker…</p><button id="signOut" class="subtle">Sign out</button></div></aside>
<main><header><div><span id="context" class="mono"></span><h1 id="pageTitle">Overview</h1></div><div class="header-actions"><span id="sync" class="mono">Connecting…</span><button id="runContent" class="primary">Generate content</button></div></header><p id="notice" role="status" hidden></p><section id="view" aria-live="polite"><p>Loading your workspace…</p></section></main>
</div>
<dialog id="editor"><form id="editorForm"><div class="dialog-head"><h2 id="editorTitle">Edit</h2><button type="button" id="closeEditor" aria-label="Close editor">×</button></div><div id="editorBody"></div><p id="editorError" role="alert"></p><div class="dialog-actions"><button type="button" id="cancelEditor">Cancel</button><button id="saveEditor" type="submit" class="primary">Save</button></div></form></dialog>
<script type="module" src="/admin/growth.js?v=short-video-3"></script></body></html>
