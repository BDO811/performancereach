<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerformanceReach, client portal</title>
<meta name="description" content="Sign in to see your PerformanceReach campaign status and reports.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@800&family=Funnel+Sans:wght@400;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/assets/system.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "PerformanceReach",
  "url": "https://athemventures.com",
  "description": "An agentic services company run by one operator, with purpose-built AI agents handling paid social, SEO/GEO, and more for sealed client engagements.",
  "knowsAbout": ["Paid Social Advertising", "SEO", "Generative Engine Optimization", "Go-to-Market Strategy"]
}
</script>
<style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: custom · redesign: full · job: try · idea: "Status is light: red is stopped, blue is being built, green is live, and every page keeps score in those three." · vibe: "Flat primary colour, printed, exact"
 * paper: oklch(98.4% 0.005 255) · accent: oklch(47% 0.285 264) · display: Funnel Display · body: Funnel Sans · hero: Split field, a blue field carries the head and the form stands on white · nav: wordmark only, left · footer: none on the sign-in · imagery: none · signature: the three-colour bar across the top of every page
 * axes: light/geometric-sans/chromatic-blue · posture: Committed, blue is the field and the action · contrast: pass · fold: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 · weakest: S, the sign-in has little to say; the blue field is the whole statement, so the head is set at poster scale */
/* Hallmark · dismissed 77 · the page is a sign-in, a two-panel screen by design, not a landing strip */
html, body { overflow-x: clip; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.portal { container-type: inline-size; display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); min-height: calc(100dvh - var(--space-xs)); }
.field-panel { background: var(--color-field); color: var(--color-field-ink); padding: var(--space-xl) var(--gutter) var(--space-xl) max(var(--gutter), calc((100cqw - var(--container)) / 2 + var(--gutter))); display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2xl); }
.field-panel .wordmark { color: var(--color-blue-ink); font-size: var(--text-xl); }
.field-panel .wordmark b { color: inherit; }
.lockup { display: flex; align-items: baseline; gap: var(--space-md); flex-wrap: wrap; }
.lockup span { font-size: var(--text-sm); font-weight: 700; }
.field-panel h1 { font-size: clamp(3.5rem, 8vw, 7.5rem); line-height: 0.95; max-width: 9ch; text-wrap: balance; }
.field-panel .sub { margin-top: var(--space-lg); font-size: var(--text-lead); line-height: 1.4; max-width: 28ch; }
.field-panel .back { font-weight: 700; }
.field-panel .back:hover { text-decoration-color: var(--color-blue-ink); }
.field-panel :focus-visible { outline-color: var(--color-blue-ink); }
.form-side { display: flex; flex-direction: column; justify-content: center; padding: var(--space-xl) max(var(--gutter), calc((100cqw - var(--container)) / 2 + var(--gutter))) var(--space-xl) var(--gutter); }
.form-view { width: 100%; max-width: 24rem; }
.form-view.hide { display: none; }
.form-view .row { margin-bottom: var(--space-md); }
#authForm .btn { width: 100%; margin-top: var(--space-xs); }
.toggle { margin-top: var(--space-lg); font-size: var(--text-sm); color: var(--color-ink-2); display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-xs); }
.toggle button { min-height: 44px; }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { cursor: not-allowed; }
#errorBox { display: none; margin-bottom: var(--space-md); }
#errorBox.show { display: block; }
.portal-view { display: none; max-width: 24rem; }
.portal-view.show { display: block; }
.portal-view .status-line { color: var(--color-ink-2); margin-bottom: var(--space-md); }
.portal-view .email { font-weight: 700; margin-bottom: var(--space-md); overflow-wrap: anywhere; }
@media (max-width: 60rem) {
  html, body { overflow-x: clip; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.portal { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .field-panel { padding: var(--space-lg) var(--gutter) var(--space-xl); gap: var(--space-xl); }
  .form-side { padding-inline: var(--gutter); }
  .field-panel h1 { font-size: clamp(3rem, 16vw, 5rem); }
  .form-side { padding: var(--space-xl) var(--gutter); }
}
</style>
</head>
<body>
  <div class="rgb-bar" aria-hidden="true"><i class="r"></i><i class="g"></i><i class="b"></i></div>
  <main class="portal">
    <section class="field-panel" aria-labelledby="formTitle">
      <div class="lockup">
        <a class="wordmark" href="/" aria-label="performancereach home">performance<b>reach</b></a>
        <span>client portal</span>
      </div>
      <div>
        <h1 id="formTitle">Sign in</h1>
        <p class="sub" id="formSub">Sign in to see your campaign status and reports.</p>
      </div>
      <a class="link back" href="/architecture/">See how the agency is built</a>
    </section>

    <section class="form-side">
      <div id="formView" class="form-view">
        <div class="notice notice--error" id="errorBox" role="alert"></div>
        <form id="authForm">
          <div class="row">
            <label class="label" for="email">Email</label>
            <input class="input input--lg" type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="row">
            <label class="label" for="password">Password</label>
            <input class="input input--lg" type="password" id="password" name="password" autocomplete="current-password" required minlength="6">
          </div>
          <button type="submit" class="btn btn--primary btn--lg" id="submitBtn">Sign in</button>
        </form>
        <div class="toggle">
          <span id="toggleText">New here?</span>
          <button type="button" class="btn btn--quiet" id="toggleBtn">Create an account</button>
        </div>
      </div>

      <div id="portalView" class="portal-view">
        <p class="status-line">Signed in as</p>
        <p class="email" id="userEmail"></p>
        <p class="status-line">There’s nothing here yet. This is a placeholder confirming sign-in works. Reports and campaign status land here once a client is live.</p>
        <button class="btn" id="signOutBtn" type="button">Sign out</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword,
      createUserWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCr30bj-pa3sv9H8h7rrijkvVmJWg5IH6A",
      authDomain: "performancereach.firebaseapp.com",
      projectId: "performancereach",
      storageBucket: "performancereach.firebasestorage.app",
      messagingSenderId: "118723320454",
      appId: "1:118723320454:web:54b8b4a2a9a449d98d8f07"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let mode = "signin";
    const formView = document.getElementById("formView");
    const portalView = document.getElementById("portalView");
    const formTitle = document.getElementById("formTitle");
    const formSub = document.getElementById("formSub");
    const submitBtn = document.getElementById("submitBtn");
    const toggleText = document.getElementById("toggleText");
    const toggleBtn = document.getElementById("toggleBtn");
    const errorBox = document.getElementById("errorBox");
    const userEmail = document.getElementById("userEmail");

    function setMode(next){
      mode = next;
      errorBox.classList.remove("show");
      if(mode === "signin"){
        formTitle.textContent = "Sign in";
        formSub.textContent = "Sign in to see your campaign status and reports.";
        submitBtn.textContent = "Sign in";
        toggleText.textContent = "New here?";
        toggleBtn.textContent = "Create an account";
      } else {
        formTitle.textContent = "Create an account";
        formSub.textContent = "Set a password to access your reports.";
        submitBtn.textContent = "Create account";
        toggleText.textContent = "Already have an account?";
        toggleBtn.textContent = "Sign in";
      }
    }
    toggleBtn.addEventListener("click", () => setMode(mode === "signin" ? "signup" : "signin"));

    function showError(message){
      errorBox.textContent = message;
      errorBox.classList.add("show");
    }

    const FRIENDLY_ERRORS = {
      "auth/invalid-email": "That email address doesn’t look right.",
      "auth/user-not-found": "No account with that email. Try creating one.",
      "auth/wrong-password": "That password doesn’t match.",
      "auth/invalid-credential": "Email or password doesn’t match.",
      "auth/email-already-in-use": "An account with that email already exists. Sign in instead.",
      "auth/weak-password": "Password needs to be at least 6 characters."
    };

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("show");
      submitBtn.disabled = true;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        if(mode === "signin"){
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
      } catch(err){
        showError(FRIENDLY_ERRORS[err.code] || "Something went wrong. Try again.");
      } finally {
        submitBtn.disabled = false;
      }
    });

    document.getElementById("signOutBtn").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if(user){
        window.location.href = "/architecture/";
      } else {
        formView.classList.remove("hide");
        portalView.classList.remove("show");
      }
    });
  </script>
</body>
</html>
