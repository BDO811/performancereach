<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf9f6">
  <title>Athem / Tasks — Ideas into action</title>
  <meta name="description" content="Capture links, screenshots, and ideas. Choose a daily focus and turn good ideas into action.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%23ed6247'/%3E%3Cpath d='M18 45 30 17h6L24 45Zm14 0 9-21 6 14-3 7Z' fill='%23fff9f1'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:#faf9f6;color:#30312b;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#faf9f6}.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;background:#faf9f6;text-align:center;transition:opacity .2s;z-index:1}.brand{font-size:37px;font-weight:700;letter-spacing:-2px;margin-bottom:25px}.brand span{color:#ed6247}.loading p{font-size:13px;line-height:1.8;color:#96917f;margin:4px 0}.loader{width:24px;height:24px;border:2px solid #e8e3d7;border-top-color:#ed6247;border-radius:50%;animation:spin .9s linear infinite;margin:16px 0 10px}.help{margin-top:22px;max-width:300px;font-size:11px;line-height:1.8;color:#a39b87}.help a{color:#b36a4d;text-underline-offset:3px}.loaded .loading{opacity:0;pointer-events:none}.fallback{margin-top:15px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.loader{animation:none}.loading{transition:none}}
  </style>
</head>
<body>
  <div class="loading" id="loading" role="status" aria-live="polite">
    <div class="brand">athem<span>.</span></div>
    <p>A home for your next good idea.</p>
    <span class="loader" aria-hidden="true"></span>
    <p>Opening your workspace…</p>
    <div class="help">If your workspace doesn’t appear, <a id="direct-link" href="https://idea-inbox.reedygazelle9.chatgpt.site/tasks" target="_blank" rel="noopener">open it directly</a>.</div>
  </div>
  <iframe id="athem-app" title="Athem Tasks workspace" src="https://idea-inbox.reedygazelle9.chatgpt.site/tasks" allow="clipboard-write"></iframe>
  <script>
    (function () {
      var appOrigin = "https://idea-inbox.reedygazelle9.chatgpt.site";
      var appUrl = appOrigin + "/tasks" + window.location.search + window.location.hash;
      var frame = document.getElementById("athem-app");
      document.getElementById("direct-link").href = appUrl;
      frame.addEventListener("load", function () {
        document.body.classList.add("loaded");
        document.getElementById("loading").setAttribute("aria-hidden", "true");
      });
      if (window.location.search || window.location.hash) frame.src = appUrl;
    }());
  </script>
  <noscript><style>.loader{display:none}iframe{position:fixed;z-index:2}.loading{display:none}</style></noscript>
</body>
</html>
